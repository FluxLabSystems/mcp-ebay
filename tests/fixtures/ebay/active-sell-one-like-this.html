<!doctype html>
<!-- Synthetic ACTIVE listing as its own seller sees it: eBay offers "Sell one
     like this" on a live listing too, so that phrase alone must never end a
     listing. The buybox still carries a working Buy It Now. Its countdown is
     rendered text only -- no epoch attribute -- so endsAt has to be computed
     from the text or not at all. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LEGO Ideas 21318 Tree House | eBay</title>
  <link rel="canonical" href="https://www.ebay.ca/itm/227489965462">
</head>
<body>
  <div id="mainContent">
    <div class="x-buybox" data-testid="x-buybox">
      <h1 class="x-item-title__mainTitle"><span class="ux-textspans">LEGO Ideas 21318 Tree House</span></h1>
      <div class="x-price-primary"><span class="ux-textspans">C $289.99</span></div>
      <div class="ux-timer"><span class="ux-timer__text">Ends in 2d 03h 15m</span></div>
      <a id="binBtn_btn" href="https://www.ebay.ca/rxo?item=227489965462" role="button">Buy It Now</a>
      <div class="x-quantity__availability"><span class="ux-textspans">More than 10 available</span></div>
    </div>
    <div class="vim x-seller-tools">
      <a href="https://www.ebay.ca/sl/prelist/suggest?sourceItemId=227489965462">Sell one like this</a>
    </div>
  </div>
</body>
</html>
